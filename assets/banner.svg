<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nestor Cremm Contatori — Enterprise Architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .pulse{animation:p 3s ease-in-out infinite}
      .pulse.d2{animation-delay:1s}.pulse.d3{animation-delay:2s}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      .flow{stroke-dasharray:6 8;animation:f 2.5s linear infinite}
      @keyframes f{to{stroke-dashoffset:-28}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity=".6"/>

  <!-- diagrama de arquitetura (motivo decorativo) -->
  <g transform="translate(790 55)" fill="none" stroke-width="1.5">
    <path class="flow" d="M60 40 L190 40 M60 40 L60 150 L190 150 M190 40 L320 95 M190 150 L320 95" stroke="#38bdf8" opacity=".7"/>
    <g class="t" font-size="13" font-weight="600" text-anchor="middle">
      <rect x="10" y="20" width="100" height="40" rx="8" fill="#0f1a30" stroke="#38bdf8"/>
      <text x="60" y="45" fill="#cbd5e1" stroke="none">CRM</text>
      <rect x="140" y="20" width="100" height="40" rx="8" fill="#0f1a30" stroke="#818cf8"/>
      <text x="190" y="45" fill="#cbd5e1" stroke="none">ITSM</text>
      <rect x="140" y="130" width="100" height="40" rx="8" fill="#0f1a30" stroke="#818cf8"/>
      <text x="190" y="155" fill="#cbd5e1" stroke="none">ERP</text>
      <rect x="270" y="75" width="100" height="40" rx="8" fill="#0f1a30" stroke="#38bdf8"/>
      <text x="320" y="100" fill="#cbd5e1" stroke="none">Data</text>
    </g>
    <circle class="pulse" cx="110" cy="40" r="4" fill="#38bdf8" stroke="none"/>
    <circle class="pulse d2" cx="240" cy="150" r="4" fill="#818cf8" stroke="none"/>
    <circle class="pulse d3" cx="270" cy="95" r="4" fill="#38bdf8" stroke="none"/>
  </g>

  <text x="56" y="92" class="mono" font-size="16" fill="#38bdf8">~/ncontatori $ whoami</text>
  <text x="56" y="150" class="t" font-size="46" font-weight="800" fill="#f1f5f9">Nestor Cremm Contatori</text>
  <rect x="56" y="170" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="56" y="210" class="t" font-size="22" font-weight="500" fill="#cbd5e1">Enterprise Architecture · Head of Technology</text>
  <text x="56" y="245" class="t" font-size="16" fill="#94a3b8">SAP · Salesforce · ServiceNow · LeanIX · Databricks  —  TOGAF · ITIL · COBIT · ISO</text>
</svg>
